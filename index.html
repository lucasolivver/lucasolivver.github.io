<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penguin Mart</title>
  <meta name="description" content="Penguin Mart, jogo de mercado 3D para Android feito por Lucas Oliveira." />
  <style>
    :root { --bg: #f4f9fc; --card: #ffffff; --ink: #1d2a36; --muted: #5a6b7a; --accent: #2e7cf6; --line: #dbe7ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1a24; --card: #162432; --ink: #e6eef5; --muted: #9fb2c2; --accent: #6aa8ff; --line: #24384a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px 56px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px clamp(16px, 4vw, 36px); text-align: center; }
    .logo { font-size: 64px; line-height: 1; margin-bottom: 8px; }
    h1 { margin: 0 0 4px; font-size: 2rem; line-height: 1.2; }
    .muted { color: var(--muted); margin: 0 0 20px; }
    a { color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 24px 0 0; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <article class="card">
    <div class="logo" aria-hidden="true">🐧</div>
    <h1>Penguin Mart</h1>
    <p class="muted">Jogo de mercado 3D para Android, feito por Lucas Oliveira.</p>
    <p>Comande um pinguim gerente: plante, colha, abasteça as prateleiras, atenda os clientes e faça o mercado crescer, área por área.</p>
    <ul>
      <li><a href="https://lucasolivver.github.io/penguin-mart-privacidade/">Política de Privacidade</a></li>
      <li>Contato: <a href="mailto:penguinmart2@gmail.com">penguinmart2@gmail.com</a></li>
    </ul>
  </article>
</main>
</body>
</html>
